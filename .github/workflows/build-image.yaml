name: build-image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_REGISTRY: ghcr.io
  IMAGE_REGISTRY_USERNAME: ${{ github.actor }}
  IMAGE_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  # See https://github.com/PCRE2Project/pcre2/tags
  IMAGE_DEP_PCRE_VERSION: 10.48
  IMAGE_DEP_PCRE_COMMIT: 7978954dbd2efc6f2196869290553cf1871b4ce6
  # See https://github.com/zlib-ng/zlib-ng/tags
  IMAGE_DEP_ZLIB_NG_VERSION: 2.3.3
  IMAGE_DEP_ZLIB_NG_COMMIT: 12731092979c6d07f42da27da673a9f6c7b13586
  # See https://github.com/openssl/openssl/tags
  IMAGE_DEP_OPENSSL_VERSION: 4.0.2
  IMAGE_DEP_OPENSSL_COMMIT: f089acdf4bc7ba94a79f4bf6eb7362c3e7d14aa9
  # See https://github.com/microsoft/mimalloc/tags
  IMAGE_DEP_MIMALLOC_VERSION: 3.5.1
  IMAGE_DEP_MIMALLOC_COMMIT: 34fbd7e7cd4627424490afe19b20f8066bfc537d
  # See https://github.com/google/ngx_brotli
  IMAGE_DEP_NGX_BROTLI_COMMIT: a71f9312c2deb28875acc7bacfdd5695a111aa53
  # See https://github.com/aperezdc/ngx-fancyindex/tags
  IMAGE_DEP_NGX_FANCYINDEX_VERSION: 0.6.0
  IMAGE_DEP_NGX_FANCYINDEX_COMMIT: 70311f239ec1e88ff79c669d126d08532ddb8554
  # See https://github.com/freeNginx/nginx/tags
  IMAGE_FREENGINX_VERSION: 1.31.4
  IMAGE_FREENGINX_COMMIT: 572c34e56271b5a56365d0c810a9e1603189b217
  IMAGE_BUILD_REVISION: 0
  # See https://quay.io/repository/buildah/stable?tab=tags
  IMAGE_BUILDAH_VERSION: 1.43.2-immutable
  IMAGE_BUILDAH_DIGEST: 19ee6da290f77e63ab7f108a1b22e63d4c36cb827fba9f494982c5ceeba27019

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        # https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build
        run: |
          podman run \
              --rm \
              --device /dev/fuse \
              --security-opt label=disable \
              -v "$PWD:/workspace" \
              -w /workspace \
              -e IMAGE_NAME="${IMAGE_NAME}" \
              -e IMAGE_REGISTRY="${IMAGE_REGISTRY}" \
              -e IMAGE_REGISTRY_USERNAME="${IMAGE_REGISTRY_USERNAME}" \
              -e IMAGE_REGISTRY_PASSWORD="${IMAGE_REGISTRY_PASSWORD}" \
              -e IMAGE_DEP_OPENSSL_VERSION="${IMAGE_DEP_OPENSSL_VERSION}" \
              -e IMAGE_DEP_OPENSSL_COMMIT="${IMAGE_DEP_OPENSSL_COMMIT}" \
              -e IMAGE_DEP_PCRE_VERSION="${IMAGE_DEP_PCRE_VERSION}" \
              -e IMAGE_DEP_PCRE_COMMIT="${IMAGE_DEP_PCRE_COMMIT}" \
              -e IMAGE_DEP_ZLIB_NG_VERSION="${IMAGE_DEP_ZLIB_NG_VERSION}" \
              -e IMAGE_DEP_ZLIB_NG_COMMIT="${IMAGE_DEP_ZLIB_NG_COMMIT}" \
              -e IMAGE_DEP_MIMALLOC_VERSION="${IMAGE_DEP_MIMALLOC_VERSION}" \
              -e IMAGE_DEP_MIMALLOC_COMMIT="${IMAGE_DEP_MIMALLOC_COMMIT}" \
              -e IMAGE_DEP_NGX_BROTLI_COMMIT="${IMAGE_DEP_NGX_BROTLI_COMMIT}" \
              -e IMAGE_DEP_NGX_FANCYINDEX_VERSION="${IMAGE_DEP_NGX_FANCYINDEX_VERSION}" \
              -e IMAGE_DEP_NGX_FANCYINDEX_COMMIT="${IMAGE_DEP_NGX_FANCYINDEX_COMMIT}" \
              -e IMAGE_FREENGINX_VERSION="${IMAGE_FREENGINX_VERSION}" \
              -e IMAGE_FREENGINX_COMMIT="${IMAGE_FREENGINX_COMMIT}" \
              -e IMAGE_BUILD_REVISION="${IMAGE_BUILD_REVISION}" \
              --user=root \
              quay.io/buildah/stable:v${IMAGE_BUILDAH_VERSION}@sha256:${IMAGE_BUILDAH_DIGEST} \
              ./build.sh --push
